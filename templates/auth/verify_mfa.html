{% extends "base.html" %}

{% block title %}Verify MFA | PSMS{% endblock %}
{% block content %}
<div class="card auth-card shadow-lg border-0">
    <div class="card-header bg-dark text-white text-center py-4">
        <h3 class="mb-1"><i class="fas fa-shield-virus me-2"></i>MFA Verification</h3>
        <p class="mb-0">Enter your time-based authentication code</p>
    </div>

    <div class="card-body p-4">
        <div class="text-center mb-4">
            <div class="mb-3">
                <span class="d-inline-flex align-items-center justify-content-center rounded-circle bg-light text-success shadow-sm"
                      style="width: 70px; height: 70px; font-size: 1.8rem;">
                    <i class="fas fa-mobile-alt"></i>
                </span>
            </div>
            <h4 class="mb-1">Second Step Verification</h4>
            <p class="text-muted mb-0">
                Open your authenticator app and enter the current 6-digit code
            </p>
        </div>

        <form method="POST" action="{{ url_for('auth.verify_mfa') }}">
            <div class="mb-4">
                <label for="code" class="form-label fw-semibold">Authentication Code</label>
                <div class="input-group input-group-lg">
                    <span class="input-group-text"><i class="fas fa-key"></i></span>
                    <input type="text"
                           class="form-control text-center"
                           id="code"
                           name="code"
                           placeholder="000000"
                           maxlength="6"
                           required>
                </div>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-success btn-lg">
                    <i class="fas fa-check me-2"></i>Verify and Continue
                </button>
            </div>
        </form>
    </div>

    <div class="card-footer text-center bg-light">
        <small class="text-muted">
            Protected login with TOTP-based MFA
        </small>
    </div>
</div>
{% endblock %}
