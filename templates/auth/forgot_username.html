{% extends "base.html" %}

{% block title %}Forgot Username | CIHE ShieldX{% endblock %}

{% block content %}
<div class="shieldx-auth-shell shieldx-auth-shell-single">
    <div class="shieldx-auth-card shieldx-auth-card-single">

        <div class="shieldx-auth-card-icon">
            <i class="fas fa-user-circle"></i>
        </div>

        <h3>Forgot Username</h3>
        <p class="shieldx-auth-subtitle">
            Enter your email address and we’ll help you recover your username.
        </p>

        <form method="POST" action="{{ url_for('auth.forgot_username') }}">
            <div class="mb-4">
                <label for="email" class="form-label fw-semibold">Email Address</label>
                <div class="input-group shieldx-auth-input">
                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        required
                    >
                </div>
            </div>

            <div class="d-grid mb-3">
                <button type="submit" class="btn shieldx-auth-login-btn">
                    <i class="fas fa-user-check me-2"></i>Recover Username
                </button>
            </div>
        </form>

        <div class="shieldx-auth-links">
            <a href="{{ url_for('auth.login') }}">Back to Login</a>
            <span>|</span>
            <a href="{{ url_for('auth.forgot_password') }}">Forgot Password?</a>
        </div>

        <div class="shieldx-auth-footer">
            Crown Institute of Higher Education Capstone Project
        </div>
    </div>
</div>
{% endblock %}
