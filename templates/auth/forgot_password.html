{% extends "base.html" %}

{% block title %}Reset Password | CIHE ShieldX{% endblock %}

{% block content %}
<div class="shieldx-auth-shell shieldx-auth-shell-single">
    <div class="shieldx-auth-card shieldx-auth-card-single">

        <div class="shieldx-auth-card-icon">
            <i class="fas fa-key"></i>
        </div>

        <h3>Reset Password</h3>
        <p class="shieldx-auth-subtitle">
            Enter your username and choose a new password.
        </p>

        <form method="POST" action="{{ url_for('auth.forgot_password') }}">

            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">Username</label>
                <div class="input-group shieldx-auth-input">
                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                    <input type="text" class="form-control" id="username" name="username"
                        placeholder="Enter your username" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="new_password" class="form-label fw-semibold">New Password</label>
                <div class="input-group shieldx-auth-input">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" class="form-control" id="new_password" name="new_password"
                        placeholder="Enter new password" required>
                </div>
            </div>

            <div class="mb-4">
                <label for="confirm_password" class="form-label fw-semibold">Confirm New Password</label>
                <div class="input-group shieldx-auth-input">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                        placeholder="Confirm new password" required>
                </div>
            </div>

            <div class="d-grid mb-3">
                <button type="submit" class="btn shieldx-auth-login-btn">
                    <i class="fas fa-shield-halved me-2"></i>Reset Password
                </button>
            </div>
        </form>

        <div class="shieldx-auth-links">
            <a href="{{ url_for('auth.login') }}">Back to Login</a>
        </div>

        <div class="shieldx-auth-footer">
            Crown Institute of Higher Education Capstone Project
        </div>
    </div>
</div>
{% endblock %}
